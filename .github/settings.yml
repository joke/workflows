# Base repository settings inherited by other repositories with `_extends: workflows`.
# Each repository keeps its own name, description, topics and required status checks.
# Synced to GitHub by https://probot.github.io/apps/settings/
repository:
  allow_squash_merge: false
  allow_merge_commit: false
  allow_rebase_merge: true
  allow_auto_merge: true
  allow_update_branch: true
  delete_branch_on_merge: true
  enable_automated_security_fixes: true
  enable_vulnerability_alerts: true

branches:
- name: main
  protection:
    required_pull_request_reviews:
      required_approving_review_count: 1
      require_code_owner_reviews: true
    required_status_checks:
      strict: true
      checks: []
    required_linear_history: true
    required_conversation_resolution: true
