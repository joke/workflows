name: gradle-build

# The build for every Gradle library. Each repository calls this workflow from its own build.yml,
# so the steps are the same everywhere. The check name is build / build.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    # release-please PRs and the release commits they merge into only touch CHANGELOG.md and the
    # manifest - a full check is superfluous there. On the release commit it would also fail: the
    # manifest already names the new version, but release-please tags it in a parallel workflow, so
    # the checkout races the tag and the version plugin rejects a manifest version with no tag.
    if: >-
      ${{ !startsWith(github.head_ref, 'release-please--')
      && !startsWith(github.event.head_commit.message, 'chore: release ') }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        # `check` configures the publications and therefore resolves the version, which needs the
        # full history.
        fetch-depth: 0
    - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5
    - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
    - run: ./gradlew check
    - name: Test Report
      uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3
      if: ${{ !cancelled() }}
      with:
        name: rests
        path: '**/test-results/**/TEST-*.xml'
        reporter: java-junit
